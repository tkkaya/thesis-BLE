; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ble_rx

[env]
platform               = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board                  = seeed_xiao_esp32s3
framework              = arduino
monitor_speed          = 115200
upload_speed           = 921600
board_build.partitions = min_spiffs.csv

monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/Adafruit BusIO@^1.17.0
  jgromes/RadioLib@^7.1.2

[env:imu_serial]
build_flags = ${env.build_flags}
build_src_filter =
  +<imu.cpp>
  +<packet.cpp>
  +<main_serial.cpp>


[env:monitor_test]
build_flags = ${env.build_flags}
build_src_filter =
  +<main_monitor_test.cpp>

[env:ble_tx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=1
build_src_filter =
  +<imu.cpp>
  +<packet.cpp>
  +<ble.cpp>
  +<main_ble_tx.cpp>

[env:ble_rx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=2
build_src_filter =
  +<packet.cpp>
  +<ble.cpp>
  +<main_ble_rx.cpp>

[env:lora_tx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=1
build_src_filter =
  +<imu.cpp>
  +<packet.cpp>
  +<radio_sx1262.cpp>
  +<main_lora_tx.cpp>

[env:lora_rx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=2
build_src_filter =
  +<packet.cpp>
  +<radio_sx1262.cpp>
  +<main_lora_rx.cpp>

[env:gfsk_tx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=1
build_src_filter =
  +<imu.cpp>
  +<packet.cpp>
  +<radio_sx1262.cpp>
  +<main_gfsk_tx.cpp>

[env:gfsk_rx]
build_flags =
  ${env.build_flags}
  -DNODE_ID=2
build_src_filter =
  +<packet.cpp>
  +<radio_sx1262.cpp>
  +<main_gfsk_rx.cpp>


[env:espnow_tx]
build_src_filter = +<*> -<main_*.cpp> +<main_espnow_tx.cpp>
build_flags = -D PROTOCOL_ESPNOW

[env:espnow_rx]
build_src_filter = +<*> -<main_*.cpp> +<main_espnow_rx.cpp>
build_flags = -D PROTOCOL_ESPNOW
